<!DOCTYPE html>

<html lang="sv">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TradingBot Sverige AI</title>

  <style>

    body{

      margin:0;

      font-family:Arial,sans-serif;

      background:#0f172a;

      color:white;

      text-align:center;

      padding:20px;

    }

    h1{color:#22c55e;}

    .card{

      background:#1e293b;

      padding:20px;

      border-radius:15px;

      margin-top:20px;

    }

    button{

      background:#22c55e;

      color:white;

      border:none;

      padding:15px 25px;

      border-radius:10px;

      font-size:18px;

      cursor:pointer;

    }

    #signal{font-size:28px;margin-top:20px;font-weight:bold;}

  </style>

</head>

<body>

<h1>📈 TradingBot Sverige AI</h1>

<p>AI Demo – Bitcoin signal</p>

<div class="card">

  <button onclick="startBot()">Starta AI</button>

  <div id="signal">Väntar på signal...</div>

</div>

<script>

function startBot(){

  const signals=[

    '🟢 KÖP BTC',

    '🔴 SÄLJ BTC',

    '🟡 AVVAKTA',

    '🟢 KÖP ETH'

  ];

  const s=signals[Math.floor(Math.random()*signals.length)];

  document.getElementById('signal').innerHTML=s;

}

</script>

</body>

</html>
