<!DOCTYPE html>

<html lang="sv">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TradingBot Sverige AI</title>

<style>

body{

  margin:0;

  background:#071126;

  color:white;

  font-family:Arial,sans-serif;

  text-align:center;

  padding:20px;

}

h1{

  color:#34d399;

  font-size:38px;

}

.card{

  background:#172338;

  border-radius:20px;

  padding:20px;

  margin-top:20px;

}

.price{

  font-size:42px;

  color:#34d399;

  margin:15px 0;

}

button{

  background:#22c55e;

  color:white;

  border:none;

  border-radius:12px;

  padding:15px 25px;

  font-size:20px;

}

.signal{

  font-size:32px;

  margin-top:20px;

  font-weight:bold;

}

.time{

  color:#94a3b8;

  margin-top:10px;

}

</style>

</head>

<body>

<h1>📈 TradingBot Sverige AI</h1>

<p>Live Bitcoin + AI Signal</p>

<div class="card">

  <div>Bitcoin (BTC/USD)</div>

  <div class="price" id="btcPrice">Laddar...</div>

  <button onclick="generateSignal()">Starta AI-analys</button>

  <div class="signal" id="signal">Väntar på signal...</div>

  <div class="time" id="updated"></div>

</div>

<script>

async function loadPrice(){

  const url="https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd";

  const response=await fetch(url);

  const data=await response.json();

  document.getElementById("btcPrice").innerHTML="$"+data.bitcoin.usd.toLocaleString();

  document.getElementById("updated").innerHTML=

    "Uppdaterad: "+new Date().toLocaleTimeString("sv-SE");

}

function generateSignal(){

  const signals=[

    "🟢 KÖP BTC",

    "🔴 SÄLJ BTC",

    "🟡 AVVAKTA",

    "🟢 STARK KÖP",

    "🔴 STARK SÄLJ"

  ];

  const random=Math.floor(Math.random()*signals.length);

  document.getElementById("signal").innerHTML=signals[random];

}

loadPrice();

setInterval(loadPrice,60000);

</script>

</body>

</html>
